name: Manual PR build
run-name: Build PR #${{ inputs.pr_number }} (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open website PR number to build
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Authorize and select PR commit
    if: >-
      github.actor == '0x5t4l1n' &&
      github.triggering_actor == '0x5t4l1n' &&
      github.repository == 'OWASP/OWASP-Hunting' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test build policy
        run: node --test scripts/test_manual_pr_build.cjs
      - name: Resolve PR and mark build pending
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            await require('./scripts/manual_pr_build.cjs').prepare({ github, context, core });

  build:
    name: Build selected PR
    needs: prepare
    if: >-
      github.actor == '0x5t4l1n' &&
      github.triggering_actor == '0x5t4l1n' &&
      github.repository == 'OWASP/OWASP-Hunting' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build website
        run: npm run build

  report:
    name: Publish PR build result
    needs: [prepare, build]
    if: >-
      always() && needs.prepare.result == 'success' &&
      github.actor == '0x5t4l1n' &&
      github.triggering_actor == '0x5t4l1n' &&
      github.repository == 'OWASP/OWASP-Hunting' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish status on the tested commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            await require('./scripts/manual_pr_build.cjs').report({ github, context, core });
